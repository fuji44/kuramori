name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if tag exists for current version
        id: check
        run: |
          VERSION=$(jq -r .version deno.json)
          TAG_NAME="v${VERSION}"
          echo "Current package version: ${VERSION}"
          echo "Target release tag: ${TAG_NAME}"

          # Query remote tags directly to guarantee accuracy without full history clone
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/${TAG_NAME}")
          if [ -n "$REMOTE_TAG" ]; then
            echo "Tag ${TAG_NAME} already exists on remote. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG_NAME} does not exist on remote. Triggering release!"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build & Attest Release Binaries
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.2
        with:
          deno-version: v2.x

      - name: Build Web Frontend
        run: deno task build:web

      - name: Compile and Archive Multi-Platform Binaries
        env:
          TAG: ${{ needs.check-version.outputs.tag_name }}
        run: |
          mkdir -p dist-release

          echo "Compiling Linux x86_64..."
          deno compile --allow-all --target x86_64-unknown-linux-gnu --include apps/web/dist --output kuramori apps/cli/src/index.ts
          tar -czf "dist-release/kuramori-${TAG}-linux-amd64.tar.gz" kuramori README.md LICENSE
          rm -f kuramori

          echo "Compiling Linux arm64..."
          deno compile --allow-all --target aarch64-unknown-linux-gnu --include apps/web/dist --output kuramori apps/cli/src/index.ts
          tar -czf "dist-release/kuramori-${TAG}-linux-arm64.tar.gz" kuramori README.md LICENSE
          rm -f kuramori

          echo "Compiling macOS Intel..."
          deno compile --allow-all --target x86_64-apple-darwin --include apps/web/dist --output kuramori apps/cli/src/index.ts
          tar -czf "dist-release/kuramori-${TAG}-darwin-amd64.tar.gz" kuramori README.md LICENSE
          rm -f kuramori

          echo "Compiling macOS Apple Silicon..."
          deno compile --allow-all --target aarch64-apple-darwin --include apps/web/dist --output kuramori apps/cli/src/index.ts
          tar -czf "dist-release/kuramori-${TAG}-darwin-arm64.tar.gz" kuramori README.md LICENSE
          rm -f kuramori

          echo "Compiling Windows x86_64..."
          deno compile --allow-all --target x86_64-pc-windows-msvc --include apps/web/dist --output kuramori.exe apps/cli/src/index.ts
          zip -j "dist-release/kuramori-${TAG}-windows-amd64.zip" kuramori.exe README.md LICENSE
          rm -f kuramori.exe

          echo "Generating SHA-256 Checksums..."
          cd dist-release
          sha256sum kuramori-* > checksums.txt
          cd ..

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.3
        with:
          subject-path: 'dist-release/*'

      - name: Create GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag_name }}
        run: |
          gh release create "$TAG" dist-release/* \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: TypeCheck, Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: TypeScript Type-Check
        run: deno task check

      - name: Code Quality & Lint
        run: deno task lint

      - name: Test Suite
        run: deno task test

      - name: Frontend Build
        run: deno task build

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: TypeCheck, Lint, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.2
        with:
          deno-version: v2.x

      - name: TypeScript Type-Check
        run: deno task check

      - name: Code Quality & Lint
        run: deno task lint

      - name: Frontend Build
        run: deno task build

      - name: Test Suite
        run: deno task test

      - name: Standalone Binary Compile Check
        run: deno task compile

      - name: Verify Version Sync
        run: |
          ROOT_VER=$(jq -r .version deno.json)
          CLI_VER=$(jq -r .version apps/cli/deno.json)
          if [ "$ROOT_VER" != "$CLI_VER" ]; then
            echo "Error: Root version ($ROOT_VER) does not match apps/cli version ($CLI_VER)"
            exit 1
          fi
          echo "Verified version sync: $ROOT_VER"

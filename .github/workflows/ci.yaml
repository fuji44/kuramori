name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: TypeCheck, Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: TypeScript Type-Check
        run: deno task check

      - name: Code Quality & Lint
        run: deno task lint

      - name: Frontend Build
        run: deno task build

      - name: Test Suite
        run: deno task test

      - name: Standalone Binary Compile Check
        run: deno task compile

      - name: Verify Version Sync
        run: |
          ROOT_VER=$(jq -r .version deno.json)
          CLI_VER=$(jq -r .version apps/cli/deno.json)
          if [ "$ROOT_VER" != "$CLI_VER" ]; then
            echo "Error: Root version ($ROOT_VER) does not match apps/cli version ($CLI_VER)"
            exit 1
          fi
          echo "Verified version sync: $ROOT_VER"
